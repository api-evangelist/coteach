name: CoTeach
description: CoTeach is an AI-powered curriculum co-planning assistant for K-12 mathematics teachers,
  built by Teaching Lab and deeply integrated with the Illustrative Mathematics (IM v.360) curriculum.
  Through a chat interface, teachers adapt lessons, generate curriculum-aligned practice problems and
  worksheets, build scaffolds and differentiated supports for multilingual learners and students with
  IEPs, and produce IM-style math diagrams (number lines, tape diagrams, area models), exporting to PDF
  or Google Docs. CoTeach preserves IM's pedagogical framework, collects no student data, and meters
  usage by message credits. It also exposes a hosted, OAuth-protected Model Context Protocol (MCP)
  server (the "Coteach Claude connector") and publishes an llms.txt so AI agents can discover the
  product and hand off to it.
